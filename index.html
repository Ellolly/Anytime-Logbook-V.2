/* ================= Events ================= */
function bindEventsCore_(){
  document.querySelectorAll('[data-act]').forEach(el=> el.addEventListener('click', onAction));
  const supCourseSel = document.getElementById('sup-course-select');
  if(supCourseSel) supCourseSel.addEventListener('change', e=>{ if(e.target.value){ state.supervisorCourseId = e.target.value; render(); } });
  const search = document.getElementById('search-input');
  if(search) search.addEventListener('input', e=>{ state.search = e.target.value; render(); focusSearch(); });

  const supG = document.getElementById('sup-group-filter');
  if(supG) supG.addEventListener('change', e=>{ state.supervisorGroupFilter = e.target.value; render(); });
  const supSg = document.getElementById('sup-subgroup-filter');
  if(supSg) supSg.addEventListener('change', e=>{ state.supervisorSubgroupFilter = e.target.value; render(); });

  const scopeSel = document.getElementById('stats-scope');
  if(scopeSel) scopeSel.addEventListener('change', e=>{ state.statsScope = e.target.value; state.statsScopeValue=''; render(); });
  const scopeValSel = document.getElementById('stats-scope-value');
  if(scopeValSel) scopeValSel.addEventListener('change', e=>{ state.statsScopeValue = e.target.value; render(); });
  const stepFilterSel = document.getElementById('stats-step-filter');
  if(stepFilterSel) stepFilterSel.addEventListener('change', e=>{ state.statsStepName = e.target.value; render(); });
  const stepModeSel = document.getElementById('stats-step-mode');
  if(stepModeSel) stepModeSel.addEventListener('change', e=>{ state.statsStepMode = e.target.value; render(); });
  const statsCtSel = document.getElementById('stats-casetype-filter');
  if(statsCtSel) statsCtSel.addEventListener('change', e=>{ state.statsCaseTypeFilter = e.target.value; render(); });

  const ctxDept = document.getElementById('ctx-dept');
  if(ctxDept) ctxDept.addEventListener('change', e=>{ state.adminDeptId = e.target.value; state.adminCourseId=''; render(); });
  const ctxCourse = document.getElementById('ctx-course');
  if(ctxCourse) ctxCourse.addEventListener('change', e=>{ state.adminCourseId = e.target.value; state.stepsCaseType=''; state.libPickOrder=[]; render(); });
  const stepsCtSel = document.getElementById('steps-casetype-select');
  if(stepsCtSel) stepsCtSel.addEventListener('change', e=>{ state.stepsCaseType = e.target.value; state.libPickOrder=[]; render(); });

  ['new-st-group','new-st-subgroup','new-st-level'].forEach(id=>{
    const sel = document.getElementById(id);
    if(sel){
      sel.addEventListener('change', async e=>{
        if(e.target.value === '__add_new__'){
          const val = prompt(t('promptNewListValue'));
          if(val && val.trim()){
            const listKey = id==='new-st-group' ? 'groups' : id==='new-st-subgroup' ? 'subgroups' : 'levels';
            if(!CONFIG[listKey].includes(val.trim())){ CONFIG[listKey].push(val.trim()); await setData('config', CONFIG); }
            render();
            setTimeout(()=>{ const s2 = document.getElementById(id); if(s2) s2.value = val.trim(); }, 0);
          } else { e.target.value = ''; }
        }
      });
    }
  });
}
function refreshPickBadges(){
  document.querySelectorAll('.step-lib-chk').forEach(cb=>{
    const b = cb.parentElement.querySelector('.pick-num'); if(!b) return;
    const i = (state.libPickOrder||[]).indexOf(cb.value);
    b.textContent = (!cb.disabled && i>=0) ? (i+1) : '';
  });
}
function bindLibraryPicks(){
  document.querySelectorAll('.step-lib-chk:not(:disabled)').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      state.libPickOrder = (state.libPickOrder||[]).filter(n=>n!==cb.value);
      if(cb.checked) state.libPickOrder.push(cb.value);   // click order = order the steps will be added in
      refreshPickBadges();
    });
  });
}
function bindEvents(){
  bindEventsCore_();
  bindLibraryPicks();
  initSortables();
  bindUnitInputs();
  bindPartnerPicker();
}
function focusSearch(){
  const el = document.getElementById('search-input');
  if(el){ el.focus(); const v = el.value; el.value=''; el.value=v; }
}

async function onAction(e){
  const el = e.currentTarget;
  const act = el.dataset.act;

  if(act==='toggle-lang'){ state.lang = state.lang==='ar'?'en':'ar'; try{localStorage.setItem('prostho_lang', state.lang);}catch(er){} render(); return; }
  if(act==='toggle-pass-visibility'){ const inp = document.getElementById(el.dataset.target); if(inp){ inp.type = inp.type==='password'?'text':'password'; el.innerHTML = icon(inp.type==='password'?'eye':'eyeOff'); } return; }
  if(act==='pick-supervisor'){ state.loginMode='supervisor'; state.loginErr=''; render(); return; }
  if(act==='pick-admin'){ state.loginMode='admin'; state.loginErr=''; render(); return; }
  if(act==='pick-signup'){ state.loginMode='signup'; state.loginErr=''; state.signupDone=false; render(); return; }
  if(act==='back-login'){ state.loginMode=null; state.loginErr=''; state.signupDone=false; render(); return; }

  if(act==='do-supervisor-login'){
    const name = document.getElementById('sup-name').value;
    const pass = document.getElementById('sup-pass').value;
    el.disabled = true; el.textContent = t('checkingBtn');
    const r = await apiLoginSupervisor(name, pass);
    if(r && r.ok){
      state.currentSupervisor = name; state.currentSupervisorPass = pass; state.currentDept = r.departmentId;
      state.supervisorCourseId = null; state.supervisorGroupFilter='all'; state.supervisorSubgroupFilter='all';
      state.screen='supervisor'; state.loginMode=null; state.loginErr='';
      state.sessionToken = r.token || null;
      saveSession({role:'supervisor', name, password:pass, departmentId:r.departmentId, token:r.token});
      const all = await getAllData();
      if(all){ CONFIG = mergeConfig(all.config); STUDENTS = all.students; PROGRESS = all.progress; ARCHIVE = normalizeArchive(all.archive); }
    } else if(r && r.rateLimited){ state.loginErr = t('rateLimitedMsg'); }
    else if(r && r.networkError){ state.loginErr = t('networkErrorPrefix') + (r.error||'') + t('networkErrorSuffix'); }
    else { state.loginErr = t('wrongPassword'); }
    render(); return;
  }
  if(act==='do-admin-login'){
    const pass = document.getElementById('admin-pass').value;
    el.disabled = true; el.textContent = t('checkingBtn');
    const r = await apiLoginAdmin(pass);
    if(r && r.ok){
      state.adminPass = pass; CREDENTIALS = applyPending('credentials', r.credentials || { supervisors: [], adminPassword: pass });
      state.screen='admin'; state.loginMode=null; state.loginErr='';
      state.sessionToken = r.token || null;
      saveSession({role:'admin', password:pass, token:r.token});
      saveCache({credentials: CREDENTIALS});
      const all = await getAllData();
      if(all){ CONFIG = mergeConfig(all.config); STUDENTS = all.students; PROGRESS = all.progress; ARCHIVE = normalizeArchive(all.archive); }
    } else if(r && r.rateLimited){ state.loginErr = t('rateLimitedMsg'); }
    else if(r && r.networkError){ state.loginErr = t('networkErrorPrefix') + (r.error||'') + t('networkErrorSuffix'); }
    else { state.loginErr = t('wrongAdminPassword'); }
    render(); return;
  }
  if(act==='do-signup'){
    const name = document.getElementById('signup-name').value.trim();
    const departmentId = document.getElementById('signup-dept').value;
    const pass = document.getElementById('signup-pass').value;
    if(!name || !pass || !departmentId){ state.loginErr = t('alertNameAndPass'); render(); return; }
    el.disabled = true; el.textContent = t('checkingBtn');
    const r = await apiRequestSupervisorSignup(name, pass, departmentId);
    if(r && r.ok){
      state.signupDone = true; state.loginErr='';
    } else if(r && r.networkError){ state.loginErr = t('networkErrorPrefix') + (r.error||'') + t('networkErrorSuffix'); }
    else if(r && r.error==='name-taken'){ state.loginErr = t('alertDuplicateSupervisor'); }
    else { state.loginErr = t('signupFailedMsg'); }
    render(); return;
  }
  if(act==='logout'){
    doLogout();
    return;
  }
  if(act==='pick-course'){ state.supervisorCourseId = el.dataset.cid; render(); return; }
  if(act==='change-course'){ state.supervisorCourseId = null; state.openStudent=null; state.openCase=null; render(); return; }

  if(act==='toggle-student'){ state.openStudent = state.openStudent===el.dataset.id ? null : el.dataset.id; state.openCase=null; state.addingCaseFor=null; state.linkingPartnersFor=null; render(); return; }
  if(act==='toggle-case'){ state.openCase = state.openCase===el.dataset.cid ? null : el.dataset.cid; render(); return; }
  if(act==='toggle-add-case'){
    state.addingCaseFor = el.dataset.sid;
    render(); return;
  }
  if(act==='cancel-add-case'){
    state.addingCaseFor = null;
    render(); return;
  }
  if(act==='confirm-add-case'){
    const sid = el.dataset.sid;
    const st = STUDENTS.find(s=>s.id===sid); if(!st) return;
    const course = studentCourse(st);
    if(course && course.deadline){
      const deadlinePassed = new Date(course.deadline + 'T23:59:59') < new Date();
      if(deadlinePassed && !studentHasStarted(st)){
        showAlert(t('deadlinePassedAlert'));
        return;
      }
    }
    const checked = [...document.querySelectorAll('.new-case-chk:checked')].map(c=>c.value);
    const custom = (document.getElementById('custom-case-type-'+sid)||{}).value?.trim();
    if(custom) checked.push(custom);
    if(checked.length===0){ showAlert(t('pickAtLeastOneCaseType')); return; }
    if(!st.cases) st.cases = [];
    checked.forEach(ct=>{ st.cases.push({ id: caseId(), caseType: ct, createdAt: new Date().toISOString(), partnerIds: [] }); });
    state.addingCaseFor = null;
    let configChanged = false;
    if(custom && course){
      if(!CONFIG.caseTypes.includes(custom)){ CONFIG.caseTypes.push(custom); configChanged = true; }
      if(!course.caseTypes.includes(custom)){ course.caseTypes.push(custom); configChanged = true; }
      if(!course.caseTypeConfigs) course.caseTypeConfigs = [];
      if(!course.caseTypeConfigs.some(c=>c.name===custom)){ course.caseTypeConfigs.push({name:custom, steps:[], custom:false}); configChanged = true; }
    }
    await setData('students', STUDENTS);
    if(configChanged) await setData('config', CONFIG);
    render(); return;
  }
  if(act==='toggle-link-partners'){
    const sid = el.dataset.sid, cid = el.dataset.cid;
    if(state.linkingPartnersFor && state.linkingPartnersFor.sid===sid && state.linkingPartnersFor.cid===cid){ state.linkingPartnersFor = null; state.partnerPick = null; state.partnerQuery = ''; }
    else {
      state.linkingPartnersFor = {sid, cid};
      const st0 = STUDENTS.find(s=>s.id===sid), cs0 = st0 && (st0.cases||[]).find(c=>c.id===cid);
      state.partnerPick = cs0 ? [...(cs0.partnerIds||[])] : [];
      state.partnerQuery = '';
    }
    render(); return;
  }
  if(act==='cancel-link-partners'){
    state.linkingPartnersFor = null; state.partnerPick = null; state.partnerQuery = '';
    render(); return;
  }
  if(act==='confirm-save-partners'){
    const sid = el.dataset.sid, cid = el.dataset.cid;
    const st = STUDENTS.find(s=>s.id===sid); if(!st) return;
    const cs = (st.cases||[]).find(c=>c.id===cid); if(!cs) return;
    const newPartnerIds = [...new Set(state.partnerPick || [])].filter(id=>id!==sid && STUDENTS.some(s=>s.id===id));
    const oldPartnerIds = cs.partnerIds || [];

    // remove the mirrored case from anyone who got unchecked (their own progress stays if they had any other link)
    oldPartnerIds.filter(pid=>!newPartnerIds.includes(pid)).forEach(pid=>{
      const partner = STUDENTS.find(s=>s.id===pid);
      if(partner) partner.cases = (partner.cases||[]).filter(c=>c.id!==cid);
    });

    // mirror the same case (same id, so progress is shared) into every participant's own list
    const allIds = [sid, ...newPartnerIds];
    allIds.forEach(pid=>{
      const person = STUDENTS.find(s=>s.id===pid);
      if(!person) return;
      if(!person.cases) person.cases = [];
      let personCase = person.cases.find(c=>c.id===cid);
      if(!personCase){
        personCase = { id: cid, caseType: cs.caseType, createdAt: cs.createdAt, partnerIds: [] };
        person.cases.push(personCase);
      }
      personCase.partnerIds = allIds.filter(x=>x!==pid);
    });

    state.linkingPartnersFor = null; state.partnerPick = null; state.partnerQuery = '';
    await setData('students', STUDENTS);
    render(); return;
  }
  if(act==='toggle-step'){
    const cid = el.dataset.cid, stepid = el.dataset.stepid;
    if(!PROGRESS[cid]) PROGRESS[cid] = {};
    const cur = PROGRESS[cid][stepid];
    if(cur && cur.done){
      if(!(await showConfirm(t('undoStepConfirmPrefix') + (cur.supervisor||'')))) return;
      delete PROGRESS[cid][stepid];
    } else {
      PROGRESS[cid][stepid] = { done:true, supervisor: state.currentSupervisor, date: new Date().toISOString(), grade:'', notes:'' };
    }
    await setData('progress', PROGRESS);
    render(); return;
  }
  if(act==='save-eval'){
    const sid = el.dataset.sid, cid = el.dataset.cid, stepid = el.dataset.stepid;
    const grade = document.getElementById(`grade-${sid}-${cid}-${stepid}`).value;
    const notes = document.getElementById(`notes-${sid}-${cid}-${stepid}`).value;
    if(PROGRESS[cid] && PROGRESS[cid][stepid]){
      PROGRESS[cid][stepid].grade = grade;
      PROGRESS[cid][stepid].notes = notes;
      await setData('progress', PROGRESS);
    }
    render(); return;
  }
  if(act==='add-student-quick'){
    if(!state.currentDept || !state.supervisorCourseId) return;
    const name = prompt(t('promptStudentName')); if(!name) return;
    STUDENTS.push({id:uid(), studentCode:'', name:name.trim(), departmentId: state.currentDept, courseId: state.supervisorCourseId, group:'', subgroup:'', cases:[], createdAt:new Date().toISOString()});
    await setData('students', STUDENTS);
    render(); return;
  }

  if(act==='admin-tab'){ state.adminTab = el.dataset.tab; render(); return; }

  if(act==='add-department'){
    const name = document.getElementById('new-dept-name').value.trim();
    if(!name) return;
    if(!CONFIG.departments) CONFIG.departments = [];
    CONFIG.departments.push({ id: deptId(), name, courses: [] });
    await setData('config', CONFIG);
    render(); return;
  }
  if(act==='rename-department'){
    const d = getDept(el.dataset.id); if(!d) return;
    const newName = prompt(t('promptNewDepartmentName'), d.name);
    if(!newName || !newName.trim()) return;
    d.name = newName.trim();
    await setData('config', CONFIG);
    render(); return;
  }
  if(act==='del-department'){
    if(!(await showConfirm(t('confirmDeleteDepartment')))) return;
    CONFIG.departments = CONFIG.departments.filter(d=>d.id!==el.dataset.id);
    await setData('config', CONFIG);
    render(); return;
  }
  if(act==='add-course'){
    const d = getDept(el.dataset.did); if(!d) return;
    const inp = document.getElementById('new-course-'+d.id);
    const name = inp.value.trim();
    if(!name) return;
    if(!d.courses) d.courses = [];
    d.courses.push({ id: courseId(), name, deadline:'', caseTypes:[], caseTypeConfigs:[] });
    await setData('config', CONFIG);
    render(); return;
  }
  if(act==='rename-course'){
    const d = getDept(el.dataset.did); if(!d) return;
    const c = (d.courses||[]).find(x=>x.id===el.dataset.cid); if(!c) return;
    const newName = prompt(t('promptNewCourseName'), c.name);
    if(!newName || !newName.trim()) return;
    c.name = newName.trim();
    await setData('config', CONFIG);
    render(); return;
  }
  if(act==='del-course'){
    const d = getDept(el.dataset.did); if(!d) return;
    if(!(await showConfirm(t('confirmDeleteCourse')))) return;
    d.courses = (d.courses||[]).filter(c=>c.id!==el.dataset.cid);
    await setData('config', CONFIG);
    render(); return;
  }

  if(act==='save-unit'){
    const st = STUDENTS.find(s=>s.id===el.dataset.sid); if(!st) return;
    const cs = (st.cases||[]).find(x=>x.id===el.dataset.cid); if(!cs) return;
    const inp = document.getElementById('unit-'+st.id+'-'+cs.id);   // partners share the case id, so the input id includes the student
    cs.unit = inp ? inp.value.trim() : '';          // belongs to this student's copy of the case only — partners keep their own
    await setData('students', STUDENTS);
    render(); return;
  }
  if(act==='edit-student'){
    const st = STUDENTS.find(s=>s.id===el.dataset.id); if(!st) return;
    const v = await showEditStudentDialog(st);
    if(!v) return;
    Object.assign(st, v);
    await setData('students', STUDENTS);
    render(); return;
  }
  if(act==='add-student'){
    const name = document.getElementById('new-st-name').value.trim();
    const studentCode = document.getElementById('new-st-code').value.trim();
    const group = document.getElementById('new-st-group').value.trim();
    const subgroup = document.getElementById('new-st-subgroup').value.trim();
    const level = document.getElementById('new-st-level').value.trim();
    if(!name){ showAlert(t('alertEnterName')); return; }
    STUDENTS.push({id:uid(), studentCode, name, departmentId: state.adminDeptId, courseId: state.adminCourseId, group, subgroup, level, cases: [], createdAt:new Date().toISOString()});
    await setData('students', STUDENTS);
    render(); return;
  }
  if(act==='download-template'){
    try{
      await loadXLSX();
      const ws = XLSX.utils.aoa_to_sheet([['name','ID','Group','Subgroup','Level']]);
      ws['!cols'] = [{wch:32},{wch:14},{wch:12},{wch:14},{wch:16}];
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Students');
      XLSX.writeFile(wb, 'students_template.xlsx');
    }catch(err){ console.error(err); showAlert(t('templateNeedsInternet')); }
    return;
  }
  if(act==='import-students'){
    if(!state.adminDeptId || !state.adminCourseId){ showAlert(t('pickContextHint')); return; }
    const fileInput = document.getElementById('import-file');
    const file = fileInput && fileInput.files[0];
    if(!file){ showAlert(t('alertPickFile')); return; }
    try{
      await loadXLSX();
      const rows = await parseSpreadsheet(file);
      let added = 0, skipped = 0, dupSkipped = 0;
      const newGroups = new Set(), newSubgroups = new Set(), newCaseTypes = new Set(), newLevels = new Set();
      const known = STUDENTS.filter(s=>s.departmentId===state.adminDeptId && s.courseId===state.adminCourseId);
      rows.forEach(row=>{
        const name = pickField(row, ['الاسم','اسم الطالب','name','الطالب']);
        if(!name){ skipped++; return; }
        const code = pickField(row, ['الكود','كود الطالب','id','code']) || '';
        if(known.some(s=>sameStudent(s, {name, studentCode: code}))){ dupSkipped++; return; }   // re-importing the same file must not duplicate students
        const group = pickField(row, ['المجموعة','مجموعة','group']) || '';
        const subgroup = pickField(row, ['المجموعة_الفرعية','المجموعة الفرعية','subgroup','sub_group']) || '';
        const level = pickField(row, ['المستوى','مستوى','level']) || '';

let xlsxLoadPromise = null;
function loadXLSX(){
  if(window.XLSX) return Promise.resolve();
  if(xlsxLoadPromise) return xlsxLoadPromise;
  xlsxLoadPromise = new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('failed to load xlsx library'));
    document.head.appendChild(s);
  });
  return xlsxLoadPromise;
}
function parseSpreadsheet(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      try{
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, {type:'array'});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        resolve(XLSX.utils.sheet_to_json(sheet, {defval:''}));
      }catch(err){ reject(err); }
    };
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}
function pickField(row, keys){
  const normalized = {};
  Object.keys(row).forEach(k => { normalized[k.trim().toLowerCase()] = row[k]; });
  for(const k of keys){
    const v = normalized[k.trim().toLowerCase()];
    if(v !== undefined && v !== null && (''+v).trim() !== '') return (''+v).trim();
  }
  return '';
}

/* ---------------- Init ---------------- */
/* -------- Near-real-time sync: quietly poll the server every few seconds and refresh if anything changed -------- */
const POLL_INTERVAL_MS = 15000;
let pollTimer = null;
function startPolling(){
  if(pollTimer) return;
  pollTimer = setInterval(pollForUpdates, POLL_INTERVAL_MS);
}
async function pollForUpdates(){
  if(!scriptConfigured() || (typeof navigator!=='undefined' && navigator.onLine===false)) return;
  if(state.screen==='login' || state.resetting) return;
  const gen = dataGeneration;
  const all = await getAllData();
  if(!all || state.resetting || gen !== dataGeneration) return;
  const mergedConfig = mergeConfig(applyPending('config', all.config));
  const mergedStudents = applyPending('students', all.students);
  const mergedProgress = applyPending('progress', all.progress);
  const mergedArchive = normalizeArchive(applyPending('archive', all.archive));
  const changed = JSON.stringify(mergedStudents)!==JSON.stringify(STUDENTS)
    || JSON.stringify(mergedProgress)!==JSON.stringify(PROGRESS)
    || JSON.stringify(mergedConfig)!==JSON.stringify(CONFIG)
    || JSON.stringify(mergedArchive)!==JSON.stringify(ARCHIVE);
  CONFIG = mergedConfig; STUDENTS = mergedStudents; PROGRESS = mergedProgress; ARCHIVE = mergedArchive;
  if(changed){
    const typing = typeof document!=='undefined' && document.activeElement && ['INPUT','TEXTAREA'].includes(document.activeElement.tagName);
    if(!typing && !state.dragging) render();
  }
}

function showSplash(){
  if(typeof document === 'undefined') return null;
  const cache = (function(){ try{ return JSON.parse(localStorage.getItem('alb_cache_v1')||'{}'); }catch(e){ return {}; } })();
  const theme = (cache.config && cache.config.theme) || {mode:'light'};
  let mode = theme.mode || 'light';
  if(mode==='auto'){ const h = new Date().getHours(); mode = (h>=6 && h<18) ? 'light' : 'dark'; }
  document.documentElement.setAttribute('data-theme', mode==='dark' ? 'dark' : 'light');
  const logoUrl = cache.config && cache.config.logoUrl;
  const title = (cache.config && cache.config.brandTitle) || 'Anytime Logbook';
  const overlay = document.createElement('div');
  overlay.id = 'splash-overlay';
  overlay.innerHTML = `
    <div id="splash-logo-wrap">
      ${logoUrl ? `<img src="${logoUrl.replace(/"/g,'&quot;')}" alt="logo">` : toothSvg(170)}
      <div id="splash-title">${(title+'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</div>
    </div>`;
  document.body.appendChild(overlay);
  return overlay;
}
function hideSplash(overlay){
  if(!overlay) return;
  const wrap = overlay.querySelector('#splash-logo-wrap');
  requestAnimationFrame(()=>{
    wrap.classList.add('shrink');
    setTimeout(()=> overlay.classList.add('hide'), 350);
  });
  setTimeout(()=> overlay.remove(), 850);
}

async function init(){
  state.storageOk = scriptConfigured();
  loadPending();
  const session = loadSession();
  if(session) state.sessionToken = session.token || null;

  const [supNames, all] = await Promise.all([
    fetchSupervisorNames(),
    getAllData()
  ]);
  const cfg = all ? all.config : null;
  const students = all ? all.students : [];
  const progress = all ? all.progress : {};
  const archive = all ? all.archive : null;
  CONFIG = mergeConfig(applyPending('config', cfg));
  SUP_NAMES = supNames;
  STUDENTS = applyPending('students', students);
  PROGRESS = applyPending('progress', progress);
  ARCHIVE = normalizeArchive(applyPending('archive', archive));
  state.loading = false;

  if(session && session.role==='admin'){
    state.adminPass = session.password;
    CREDENTIALS = applyPending('credentials', loadCache().credentials || { supervisors: [], adminPassword: session.password });
    state.screen = 'admin';
  } else if(session && session.role==='supervisor'){
    state.currentSupervisor = session.name;
    state.currentSupervisorPass = session.password;
    state.currentDept = session.departmentId;
    state.screen = 'supervisor';
  }

  render();
  hideSplash(splashOverlay);
  flushPending();
  if(session) revalidateSession(session);
  if(session && shouldLock()) showLockScreen(session);
  else touchActivity();
  startPolling();
}
init();
</script>
</body>
</html>
