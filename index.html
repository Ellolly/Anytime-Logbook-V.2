<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anytime Logbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Space+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1C2321; --bg:#F6F3EC; --card:#FFFFFF;
    --teal-900:#173B38; --teal-700:#1F4E4A; --teal-500:#4F8A85; --teal-100:#DCEAE8;
    --gold:#C99A3C; --gold-light:#F2E3BE; --rust:#B5563B; --rust-light:#F4DCD3;
    --line:#E4DFD2; --banner-text:#5A430F; --banner-err-text:#7A2E1B; --radius:14px;
  }
  html[data-theme="dark"]{
    --ink:#E8E4DA; --bg:#101513; --card:#1B2320; --teal-900:#EDEAE2; --teal-500:#8CBEB7;
    --teal-100:#213330; --gold-light:#3A2E12; --rust-light:#3A211B; --line:#2B3532;
    --banner-text:#E7CE8F; --banner-err-text:#F0B3A2;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:'Cairo',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;transition:background .2s ease,color .2s ease;}
  #root{max-width:780px;margin:0 auto;padding:16px 14px 60px;}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
  .brand img{width:38px;height:38px;border-radius:10px;object-fit:cover;flex-shrink:0;}
  .brand svg{flex-shrink:0;}
  .brand-text{flex:1;min-width:0;}
  .brand h1{font-size:17px;font-weight:800;margin:0;color:var(--teal-900);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .brand span{display:block;font-size:11.5px;font-weight:500;color:var(--teal-500);letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .lang-toggle{flex-shrink:0;background:var(--teal-100);color:var(--teal-900);border:none;border-radius:9px;padding:7px 10px;font-family:inherit;font-weight:800;font-size:11.5px;cursor:pointer;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
  .card h2{margin:0 0 12px;font-size:15px;font-weight:700;color:var(--teal-900);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--teal-700);color:#fff;border:none;border-radius:10px;padding:11px 16px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;transition:opacity .15s ease;width:100%;}
  .btn:active{opacity:.8;}
  .btn.secondary{background:var(--teal-100);color:var(--teal-900);}
  .btn.gold{background:var(--gold);color:#3A2C08;}
  .btn.rust{background:var(--rust-light);color:var(--rust);}
  .btn.ghost{background:transparent;color:var(--teal-700);border:1px solid var(--line);}
  .btn.sm{width:auto;padding:7px 12px;font-size:12.5px;border-radius:8px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .row{display:flex;gap:8px;}
  .row.wrap{flex-wrap:wrap;}
  label{font-size:12.5px;font-weight:600;color:var(--teal-700);margin-bottom:4px;display:block;}
  input[type=text],input[type=password],input[type=number],select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-family:inherit;font-size:14px;background:var(--card);color:var(--ink);}
  input[type=color]{width:56px;height:40px;padding:2px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--teal-500);outline-offset:1px;border-color:var(--teal-500);}
  .field{margin-bottom:10px;}
  .top-actions{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px;flex-wrap:wrap;}
  .pill{font-size:11.5px;font-weight:700;background:var(--teal-100);color:var(--teal-900);padding:5px 10px;border-radius:20px;}
  .context-bar{display:flex;gap:8px;margin-bottom:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;}
  .context-bar .field{flex:1;margin-bottom:0;}
  .tabbar{display:flex;gap:4px;margin-bottom:14px;background:var(--teal-100);padding:4px;border-radius:12px;overflow-x:auto;}
  .tabbar button{flex:1;border:none;background:transparent;padding:9px 6px;border-radius:9px;font-family:inherit;font-weight:700;font-size:11px;color:var(--teal-700);cursor:pointer;white-space:nowrap;}
  .tabbar button.active{background:var(--teal-700);color:#fff;}
  .course-card{display:flex;align-items:center;gap:12px;padding:14px;border:1.5px solid var(--line);border-radius:12px;margin-bottom:10px;cursor:pointer;background:var(--card);}
  .course-card b{color:var(--teal-900);font-size:14.5px;}
  .student-card{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;background:var(--card);}
  .student-head{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;}
  .ring{position:relative;width:42px;height:42px;flex-shrink:0;}
  .ring svg{transform:rotate(-90deg);}
  .ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;color:var(--teal-900);font-family:'Space Mono',monospace;}
  .student-info{flex:1;min-width:0;}
  .student-info .nm{font-weight:700;font-size:14.5px;color:var(--teal-900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .student-info .meta{font-size:12px;color:var(--teal-500);margin-top:2px;}
  .chev{color:var(--teal-500);font-size:13px;flex-shrink:0;}
  .student-body{border-top:1px solid var(--line);padding:10px 14px 14px;display:none;}
  .student-body.open{display:block;}
  .case-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;background:var(--bg);}
  .case-item .ci-info{flex:1;min-width:0;}
  .case-item .ci-name{font-weight:700;font-size:13.5px;color:var(--teal-900);}
  .case-item .ci-meta{font-size:11.5px;color:var(--teal-500);margin-top:2px;}
  .case-body{border-top:1px dashed var(--line);margin-top:8px;padding-top:8px;}
  .total-grade{background:var(--gold-light);color:var(--banner-text);font-weight:800;font-size:13px;padding:8px 12px;border-radius:10px;margin-bottom:10px;text-align:center;}
  .step-row{padding:10px 0;border-bottom:1px dashed var(--line);}
  .step-row:last-child{border-bottom:none;}
  .step-top{display:flex;align-items:center;gap:10px;}
  .step-num{width:22px;height:22px;border-radius:50%;background:var(--teal-100);color:var(--teal-700);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'Space Mono',monospace;}
  .step-num.done{background:var(--gold);color:#3A2C08;}
  .step-main{flex:1;min-width:0;}
  .step-name{font-weight:600;font-size:13.5px;color:var(--ink);}
  .step-sub{font-size:11.5px;color:var(--teal-500);margin-top:2px;}
  .step-sub.pending{color:var(--rust);}
  .toggle{width:44px;height:26px;border-radius:20px;background:var(--line);position:relative;cursor:pointer;flex-shrink:0;border:none;padding:0;transition:background .15s ease;}
  .toggle.on{background:var(--teal-700);}
  .toggle .knob{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s ease;box-shadow:0 1px 2px rgba(0,0,0,.25);}
  .toggle.on .knob{transform:translateX(-18px);}
  html[dir="ltr"] .toggle .knob{right:auto;left:3px;}
  html[dir="ltr"] .toggle.on .knob{transform:translateX(18px);}
  .eval-row{display:flex;gap:6px;margin-top:8px;padding-inline-start:32px;flex-wrap:wrap;}
  .eval-row input{flex:1;min-width:90px;font-size:12.5px;padding:7px 10px;}
  .eval-row input.grade-input{max-width:80px;flex:0 0 80px;}
  .empty{text-align:center;padding:34px 14px;color:var(--teal-500);}
  .empty p{font-size:13.5px;margin:0;}
  .list-item{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;gap:8px;}
  .list-item .txt{font-size:13.5px;font-weight:600;flex:1;min-width:0;}
  .list-item .txt small{display:block;font-weight:400;color:var(--teal-500);font-size:11.5px;margin-top:2px;}
  .icon-btn{background:none;border:none;cursor:pointer;color:var(--rust);font-size:16px;padding:4px 6px;flex-shrink:0;}
  .icon-btn.up-down{color:var(--teal-700);}
  .sub-list{margin-inline-start:18px;margin-top:6px;}
  .chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .chip{display:flex;align-items:center;gap:6px;background:var(--teal-100);color:var(--teal-900);padding:6px 10px;border-radius:20px;font-size:12.5px;font-weight:600;}
  .chip button{background:none;border:none;color:var(--rust);cursor:pointer;font-size:13px;padding:0;line-height:1;}
  .stat-table{width:100%;border-collapse:collapse;font-size:12.5px;}
  .stat-table th{background:var(--teal-100);color:var(--teal-900);padding:8px 6px;text-align:right;font-weight:700;position:sticky;top:0;}
  html[dir="ltr"] .stat-table th{text-align:left;}
  .stat-table td{padding:8px 6px;border-bottom:1px solid var(--line);}
  .bar-wrap{background:var(--line);border-radius:6px;height:8px;width:70px;overflow:hidden;}
  .bar-fill{background:var(--gold);height:100%;}
  .table-scroll{overflow-x:auto;}
  .login-screen{padding-top:6vh;}
  .role-card{display:flex;align-items:center;gap:14px;padding:16px;border:1.5px solid var(--line);border-radius:14px;margin-bottom:12px;cursor:pointer;background:var(--card);}
  .role-card .ic{width:42px;height:42px;border-radius:11px;background:var(--teal-100);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .role-card .tx b{display:block;font-size:14.5px;color:var(--teal-900);}
  .role-card .tx span{font-size:12px;color:var(--teal-500);}
  .banner{background:var(--gold-light);border:1px solid var(--gold);color:var(--banner-text);font-size:12.5px;padding:10px 12px;border-radius:10px;margin-bottom:14px;line-height:1.6;}
  .banner.err{background:var(--rust-light);border-color:var(--rust);color:var(--banner-err-text);}
  .search-box{margin-bottom:12px;}
  h3.section-title{font-size:12.5px;font-weight:800;color:var(--teal-500);text-transform:uppercase;letter-spacing:.4px;margin:18px 0 8px;}
  .file-drop{border:1.5px dashed var(--teal-500);border-radius:10px;padding:14px;text-align:center;background:var(--teal-100);margin-bottom:8px;}
  .file-drop input[type=file]{width:100%;font-size:12.5px;}
  .sticky-warn{position:sticky;top:0;z-index:20;}
</style>
</head>

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxcF_MOXGB1zoO5Oe0DutoEyTU4Gl376r4U1z9VG0osixvaQt5e31Bum7i9Mz_I3fGD/exec";
function scriptConfigured(){ return !!SCRIPT_URL && !SCRIPT_URL.includes('PASTE_YOUR'); }
// fetch() has no built-in timeout — without this, a stalled connection leaves the UI stuck forever
// (e.g. a disabled button stuck on "checking...") instead of showing a clear error.
async function fetchWithTimeout(url, opts={}, ms=25000){
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), ms);
  try{
    return await fetch(url, { ...opts, signal: controller.signal });
  } finally {
    clearTimeout(timer);
  }
}
async function getData(key, fallback){
  if(!scriptConfigured()) return fallback;
  try{
    const res = await fetchWithTimeout(`${SCRIPT_URL}?action=get&key=${encodeURIComponent(key)}`);
    if(!res.ok) throw new Error('bad status ' + res.status);
    const json = await res.json();
    if(json && json.value !== undefined && json.value !== null) return JSON.parse(json.value);
    return fallback;
  }catch(e){ console.error('getData failed', key, e); state.storageOk = false; return fallback; }
}
async function setData(key, value){
  if(!scriptConfigured()) return false;
  let auth = null;
  if(state.screen==='admin' && state.adminPass) auth = { role:'admin', password: state.adminPass };
  else if(state.screen==='supervisor' && state.currentSupervisor) auth = { role:'supervisor', name: state.currentSupervisor, password: state.currentSupervisorPass };
  try{
    const res = await fetchWithTimeout(SCRIPT_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:'save', key, value: JSON.stringify(value), auth }) });
    if(!res.ok) throw new Error('bad status ' + res.status);
    const json = await res.json();
    if(!json.ok){ console.error('save rejected', json.error); alert(t('saveFailedAlert')); state.storageOk=false; return false; }
    state.storageOk = true; return true;
  }catch(e){ console.error('setData failed', key, e); state.storageOk = false; return false; }
}
async function fetchSupervisorNames(){
  if(!scriptConfigured()) return [];
  try{ const res = await fetchWithTimeout(`${SCRIPT_URL}?action=supervisor-names`); const json = await res.json(); return json.names || []; }
  catch(e){ return []; }
}
async function apiLoginSupervisor(name, password){
  if(!scriptConfigured()) return {ok:false};
  try{
    const res = await fetchWithTimeout(SCRIPT_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:'login-supervisor', name, password }) });
    return await res.json();
  }catch(e){ return {ok:false, networkError:true, error: e.name==='AbortError' ? (state.lang==='ar'?'انتهت مهلة الاتصال':'Request timed out') : e.message}; }
}
async function apiLoginAdmin(password){
  if(!scriptConfigured()) return {ok:false};
  try{
    const res = await fetchWithTimeout(SCRIPT_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},

  }catch(e){ return {ok:false, networkError:true, error: e.name==='AbortError' ? (state.lang==='ar'?'انتهت مهلة الاتصال':'Request timed out') : e.message}; }
}

function stepId(){ return 'st_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

function defaultSteps(){ return DEFAULT_STEPS_NAMES.map(n=>({id:stepId(), name:n})); }
function defaultConfig(){
  return {
    departments: [],
    groups: DEFAULT_GROUPS.slice(), subgroups: DEFAULT_SUBGROUPS.slice(), caseTypes: DEFAULT_CASE_TYPES.slice(),
    levels: [],
    fieldLabels: { group:"", subgroup:"", caseType:"", level:"" },
    brandTitle:"", brandSubtitle:"", logoUrl:"",
    theme: { mode:"light", accent:"" }
  };
}
function mergeConfig(cfg){
  const d = defaultConfig();
  if(!cfg) return d;
  return {
    departments: Array.isArray(cfg.departments) ? cfg.departments.map(dep=>({
      id: dep.id, name: dep.name,
      courses: Array.isArray(dep.courses) ? dep.courses.map(c=>{
        const legacySteps = Array.isArray(c.steps) ? c.steps.map(s=> typeof s==='string' ? {id:stepId(), name:s} : s) : [];
        const caseTypes = Array.isArray(c.caseTypes) ? c.caseTypes : [];
        let caseTypeConfigs = Array.isArray(c.caseTypeConfigs) ? c.caseTypeConfigs.map(cc=>({
          name: cc.name,
          steps: Array.isArray(cc.steps) ? cc.steps.map(s=> typeof s==='string' ? {id:stepId(), name:s} : s) : []
        })) : null;
        if(!caseTypeConfigs){
          // migrate from the old course-wide steps: give every assigned case type a copy of the old steps as a starting point
          caseTypeConfigs = caseTypes.map(name=>({ name, steps: legacySteps.map(s=>({id: stepId(), name: s.name})) }));
        }
        return { id: c.id, name: c.name, deadline: c.deadline || "", caseTypes, caseTypeConfigs };
      }) : []
    })) : d.departments,
    groups: Array.isArray(cfg.groups) ? cfg.groups : d.groups,
    subgroups: Array.isArray(cfg.subgroups) ? cfg.subgroups : d.subgroups,
    caseTypes: Array.isArray(cfg.caseTypes) ? cfg.caseTypes : d.caseTypes,
    levels: Array.isArray(cfg.levels) ? cfg.levels : d.levels,
    fieldLabels: Object.assign({group:"",subgroup:"",caseType:"",level:""}, cfg.fieldLabels||{}),
    brandTitle: cfg.brandTitle || "", brandSubtitle: cfg.brandSubtitle || "", logoUrl: cfg.logoUrl || "",
    theme: cfg.theme || d.theme
  };
}
function getDept(id){ return (CONFIG.departments||[]).find(d=>d.id===id) || null; }
function getCourse(deptIdVal, courseIdVal){ const d = getDept(deptIdVal); if(!d) return null; return (d.courses||[]).find(c=>c.id===courseIdVal) || null; }
function studentCourse(st){ return getCourse(st.departmentId, st.courseId); }
function courseCaseTypes(course){ return (course && course.caseTypes) ? course.caseTypes : []; }
function caseTypeConfig(course, caseTypeName){
  if(!course) return null;
  return (course.caseTypeConfigs||[]).find(c=>c.name===caseTypeName) || null;
}
function caseSteps(course, caseTypeName){
  const cfg = caseTypeConfig(course, caseTypeName);
  return cfg ? cfg.steps : [];
}
function studentHasStarted(st){

}

function fmtDate(iso){

  return d.toLocaleDateString(locale,{day:'numeric',month:'short'}) + ' - ' + d.toLocaleTimeString(locale,{hour:'2-digit',minute:'2-digit'});

function casePct(st, cs){
  const course = studentCourse(st);
  const steps = caseSteps(course, cs.caseType);
  if(!steps.length) return 0;
  const p = PROGRESS[cs.id]||{};
  const done = steps.filter(s => p[s.id] && p[s.id].done).length;
  return Math.round((done/steps.length)*100);
}
function studentAggregatePct(st){
  const cases = st.cases||[];
  if(!cases.length) return 0;
  const total = cases.reduce((sum,cs)=>sum+casePct(st,cs),0);
  return Math.round(total/cases.length);
}
function caseTotalGrade(st, cs){
  const p = PROGRESS[cs.id]||{};
  let sum = 0;
  Object.values(p).forEach(rec=>{ const n = parseFloat(rec.grade); if(!isNaN(n)) sum += n; });
  return sum;
}

function ringSvg(pct, size=42){
  const r = (size/2)-4, c = 2*Math.PI*r, off = c - (pct/100)*c;
  const color = pct===100 ? 'var(--gold)' : 'var(--teal-500)';
  return `<div class="ring"><svg width="${size}" height="${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="var(--line)" stroke-width="4" fill="none"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color}" stroke-width="4" fill="none"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round"/>
  </svg><div class="pct">${pct}%</div></div>`;
}

function applyTheme(){
  const theme = CONFIG.theme || {mode:'light',accent:''};
  let mode = theme.mode || 'light';
  if(mode==='auto'){ const h = new Date().getHours(); mode = (h>=6 && h<18) ? 'light' : 'dark'; }
  document.documentElement.setAttribute('data-theme', mode==='dark' ? 'dark' : 'light');
  if(theme.accent) document.documentElement.style.setProperty('--teal-700', theme.accent);
  else document.documentElement.style.removeProperty('--teal-700');
}

  const course = studentCourse(st);
  const steps = caseSteps(course, cs.caseType);
  const p = PROGRESS[cs.id]||{};
  if(steps.length===0) return `<div class="empty"><p>—</p></div>`;
  const total = caseTotalGrade(st, cs);
  return `<div class="total-grade">${t('totalGradeLabel')}${total}</div>` + steps.map((step,i)=>{
    const rec = p[step.id];
    const done = rec && rec.done;
    return `
    <div class="step-row">
      <div class="step-top">
        <div class="step-num ${done?'done':''}">${i+1}</div>
        <div class="step-main">
          <div class="step-name">${esc(step.name)}</div>
          <div class="step-sub ${done?'':'pending'}">${done ? `${t('signedByPrefix')}${esc(rec.supervisor)} · ${fmtDate(rec.date)}` : t('notDoneYet')}</div>
        </div>
        ${readonly ? '' : `<button class="toggle ${done?'on':''}" data-act="toggle-step" data-sid="${st.id}" data-cid="${cs.id}" data-stepid="${step.id}"><span class="knob"></span></button>`}
      </div>
      ${(!readonly && done) ? `
      <div class="eval-row">
        <input type="number" class="grade-input" id="grade-${st.id}-${cs.id}-${step.id}" placeholder="${t('gradeLabel')}" value="${esc(rec.grade!==undefined?rec.grade:'')}">
        <input type="text" id="notes-${st.id}-${cs.id}-${step.id}" placeholder="${t('notesLabel')}" value="${esc(rec.notes||'')}">
        <button class="btn sm" style="width:auto;" data-act="save-eval" data-sid="${st.id}" data-cid="${cs.id}" data-stepid="${step.id}">${t('saveEvalBtn')}</button>
      </div>` : ''}
    </div>`;
  }).join('');
}
function partnerNames(st, cs){
  const ids = cs.partnerIds || [];
  return ids.map(id=>{ const p = STUDENTS.find(s=>s.id===id); return p ? p.name : null; }).filter(Boolean);
}
function partnerDisplayList(cs){
  const ids = cs.partnerIds || [];
  return ids.map(id=>{
    const p = STUDENTS.find(s=>s.id===id);
    if(!p) return null;
    let label = esc(p.name);
    if(p.studentCode) label += ' <span style="color:var(--teal-500);">#'+esc(p.studentCode)+'</span>';
    const meta = [p.group?t('groupPrefix')+esc(p.group):'', p.subgroup?t('subgroupPrefix')+esc(p.subgroup):''].filter(Boolean).join(' · ');
    return meta ? `${label} (${meta})` : label;
  }).filter(Boolean);
}

function casesHtml(st, readonly){
  const cases = st.cases||[];
  const openCase = state.openCase;
  let html = '';
  if(cases.length===0) html += `<div class="empty"><p>${t('noCasesYet')}</p></div>`;
  else cases.forEach(cs=>{
    const pct = casePct(st,cs);
    const total = caseTotalGrade(st,cs);
    const open = openCase===cs.id;
    const partners = partnerDisplayList(cs);
    const linkingThis = state.linkingPartnersFor && state.linkingPartnersFor.sid===st.id && state.linkingPartnersFor.cid===cs.id;
    html += `
    <div class="case-item" data-act="toggle-case" data-sid="${st.id}" data-cid="${cs.id}">
      <div style="width:32px;flex-shrink:0;">${ringSvg(pct,32)}</div>
      <div class="ci-info">
        <div class="ci-name">${esc(cs.caseType || t('caseLabel'))}</div>
        <div class="ci-meta">${t('totalGradeLabel')}${total}</div>
        ${partners.length ? `<div class="ci-meta">${t('partnersLabel')}${partners.join('، ')}</div>` : ''}
      </div>
      ${!readonly ? `<button class="icon-btn" data-act="del-case" data-sid="${st.id}" data-cid="${cs.id}" title="${t('deleteCaseBtn')}">🗑</button>` : ''}
      <div class="chev">${open?'▲':'▼'}</div>
    </div>
    ${open ? `<div class="case-body">
      ${stepsHtmlForCase(st, cs, readonly)}
      ${!readonly ? `<button class="btn ghost sm" style="width:auto;margin-top:8px;" data-act="toggle-link-partners" data-sid="${st.id}" data-cid="${cs.id}">${t('linkPartnerBtn')}</button>` : ''}
      ${linkingThis ? partnerPanelHtml(st,cs) : ''}
    </div>` : ''}
    `;
  });
  if(!readonly){
    if(state.addingCaseFor === st.id){
      html += addCasePanelHtml(st);
    } else {
      html += `<button class="btn secondary sm" style="width:auto;margin-top:6px;" data-act="toggle-add-case" data-sid="${st.id}">${t('addCaseBtn')}</button>`;
    }
  }
  return html;
}

/* ================= Events ================= */
function bindEvents(){
  document.querySelectorAll('[data-act]').forEach(el=> el.addEventListener('click', onAction));
  const search = document.getElementById('search-input');
  if(search) search.addEventListener('input', e=>{ state.search = e.target.value; render(); focusSearch(); });

  const supG = document.getElementById('sup-group-filter');
  if(supG) supG.addEventListener('change', e=>{ state.supervisorGroupFilter = e.target.value; render(); });
  const supSg = document.getElementById('sup-subgroup-filter');
  if(supSg) supSg.addEventListener('change', e=>{ state.supervisorSubgroupFilter = e.target.value; render(); });

  const scopeSel = document.getElementById('stats-scope');
  if(scopeSel) scopeSel.addEventListener('change', e=>{ state.statsScope = e.target.value; state.statsScopeValue=''; render(); });
  const scopeValSel = document.getElementById('stats-scope-value');
  if(scopeValSel) scopeValSel.addEventListener('change', e=>{ state.statsScopeValue = e.target.value; render(); });
  const stepFilterSel = document.getElementById('stats-step-filter');
  if(stepFilterSel) stepFilterSel.addEventListener('change', e=>{ state.statsStepId = e.target.value; render(); });
  const statsCtSel = document.getElementById('stats-casetype-filter');
  if(statsCtSel) statsCtSel.addEventListener('change', e=>{ state.statsCaseTypeFilter = e.target.value; state.statsStepId=''; render(); });

  const ctxDept = document.getElementById('ctx-dept');
  if(ctxDept) ctxDept.addEventListener('change', e=>{ state.adminDeptId = e.target.value; state.adminCourseId=''; render(); });
  const ctxCourse = document.getElementById('ctx-course');
  if(ctxCourse) ctxCourse.addEventListener('change', e=>{ state.adminCourseId = e.target.value; state.stepsCaseType=''; render(); });
  const stepsCtSel = document.getElementById('steps-casetype-select');
  if(stepsCtSel) stepsCtSel.addEventListener('change', e=>{ state.stepsCaseType = e.target.value; render(); });

  ['new-st-group','new-st-subgroup','new-st-level'].forEach(id=>{
    const sel = document.getElementById(id);
    if(sel){
      sel.addEventListener('change', async e=>{
        if(e.target.value === '__add_new__'){
          const val = prompt(t('promptNewListValue'));
          if(val && val.trim()){
            const listKey = id==='new-st-group' ? 'groups' : id==='new-st-subgroup' ? 'subgroups' : 'levels';
            if(!CONFIG[listKey].includes(val.trim())){ CONFIG[listKey].push(val.trim()); await setData('config', CONFIG); }
            render();
            setTimeout(()=>{ const s2 = document.getElementById(id); if(s2) s2.value = val.trim(); }, 0);
          } else { e.target.value = ''; }
        }
      });
    }
  });
}
function focusSearch(){
  const el = document.getElementById('search-input');
  if(el){ el.focus(); const v = el.value; el.value=''; el.value=v; }
}

async function onAction(e){
  const el = e.currentTarget;
  const act = el.dataset.act;

  if(act==='toggle-lang'){ state.lang = state.lang==='ar'?'en':'ar'; try{localStorage.setItem('prostho_lang', state.lang);}catch(er){} render(); return; }
  if(act==='toggle-pass-visibility'){ const inp = document.getElementById(el.dataset.target); if(inp) inp.type = inp.type==='password'?'text':'password'; return; }
  if(act==='pick-supervisor'){ state.loginMode='supervisor'; state.loginErr=''; render(); return; }
  if(act==='pick-admin'){ state.loginMode='admin'; state.loginErr=''; render(); return; }
  if(act==='back-login'){ state.loginMode=null; state.loginErr=''; render(); return; }

  if(act==='do-supervisor-login'){
    const name = document.getElementById('sup-name').value;
    const pass = document.getElementById('sup-pass').value;
    el.disabled = true; el.textContent = t('checkingBtn');
    const r = await apiLoginSupervisor(name, pass);
    if(r && r.ok){
      state.currentSupervisor = name; state.currentSupervisorPass = pass; state.currentDept = r.departmentId;
      state.supervisorCourseId = null; state.supervisorGroupFilter='all'; state.supervisorSubgroupFilter='all';
      state.screen='supervisor'; state.loginMode=null; state.loginErr='';
    } else if(r && r.networkError){ state.loginErr = t('networkErrorPrefix') + (r.error||'') + t('networkErrorSuffix'); }
    else { state.loginErr = t('wrongPassword'); }
    render(); return;
  }
  if(act==='do-admin-login'){
    const pass = document.getElementById('admin-pass').value;
    el.disabled = true; el.textContent = t('checkingBtn');
    const r = await apiLoginAdmin(pass);
    if(r && r.ok){
      state.adminPass = pass; CREDENTIALS = r.credentials || { supervisors: [], adminPassword: pass };
      state.screen='admin'; state.loginMode=null; state.loginErr='';
    } else if(r && r.networkError){ state.loginErr = t('networkErrorPrefix') + (r.error||'') + t('networkErrorSuffix'); }
    else { state.loginErr = t('wrongAdminPassword'); }
    render(); return;
  }
  if(act==='logout'){
    state.screen='login'; state.currentSupervisor=null; state.currentSupervisorPass=null; state.currentDept=null;
    state.supervisorCourseId=null; state.adminPass=null; CREDENTIALS=null; state.loginMode=null;
    state.openStudent=null; state.openCase=null; state.search='';
    render(); return;
  }
  if(act==='pick-course'){ state.supervisorCourseId = el.dataset.cid; render(); return; }
  if(act==='change-course'){ state.supervisorCourseId = null; state.openStudent=null; state.openCase=null; render(); return; }

  if(act==='toggle-student'){ state.openStudent = state.openStudent===el.dataset.id ? null : el.dataset.id; state.openCase=null; state.addingCaseFor=null; state.linkingPartnersFor=null; render(); return; }
  if(act==='toggle-case'){ state.openCase = state.openCase===el.dataset.cid ? null : el.dataset.cid; render(); return; }
  if(act==='toggle-add-case'){
    state.addingCaseFor = el.dataset.sid;
    render(); return;
  }
  if(act==='cancel-add-case'){
    state.addingCaseFor = null;
    render(); return;
  }
  if(act==='confirm-add-case'){
    const sid = el.dataset.sid;
    const st = STUDENTS.find(s=>s.id===sid); if(!st) return;
    const course = studentCourse(st);
    if(course && course.deadline){
      const deadlinePassed = new Date(course.deadline + 'T23:59:59') < new Date();
      if(deadlinePassed && !studentHasStarted(st)){
        alert(t('deadlinePassedAlert'));
        return;
      }
    }
    const checked = [...document.querySelectorAll('.new-case-chk:checked')].map(c=>c.value);
    const custom = (document.getElementById('custom-case-type-'+sid)||{}).value?.trim();
    if(custom) checked.push(custom);
    if(checked.length===0){ alert(t('pickAtLeastOneCaseType')); return; }
    if(!st.cases) st.cases = [];
    checked.forEach(ct=>{ st.cases.push({ id: caseId(), caseType: ct, createdAt: new Date().toISOString(), partnerIds: [] }); });
    state.addingCaseFor = null;
    let configChanged = false;
    if(custom && course){
      if(!CONFIG.caseTypes.includes(custom)){ CONFIG.caseTypes.push(custom); configChanged = true; }
      if(!course.caseTypes.includes(custom)){ course.caseTypes.push(custom); configChanged = true; }
      if(!course.caseTypeConfigs) course.caseTypeConfigs = [];
      if(!course.caseTypeConfigs.some(c=>c.name===custom)){ course.caseTypeConfigs.push({name:custom, steps:[]}); configChanged = true; }
    }
    await setData('students', STUDENTS);
    if(configChanged) await setData('config', CONFIG);
    render(); return;
  }
  if(act==='toggle-link-partners'){
    const sid = el.dataset.sid, cid = el.dataset.cid;
    if(state.linkingPartnersFor && state.linkingPartnersFor.sid===sid && state.linkingPartnersFor.cid===cid) state.linkingPartnersFor = null;
    else state.linkingPartnersFor = {sid, cid};
    render(); return;
  }
  if(act==='cancel-link-partners'){
    state.linkingPartnersFor = null;
    render(); return;
  }
  if(act==='confirm-save-partners'){
    const sid = el.dataset.sid, cid = el.dataset.cid;
    const st = STUDENTS.find(s=>s.id===sid); if(!st) return;
    const cs = (st.cases||[]).find(c=>c.id===cid); if(!cs) return;
    const newPartnerIds = [...document.querySelectorAll('.partner-chk:checked')].map(c=>c.value);
    const oldPartnerIds = cs.partnerIds || [];

    // remove the mirrored case from anyone who got unchecked (their own progress stays if they had any other link)
    oldPartnerIds.filter(pid=>!newPartnerIds.includes(pid)).forEach(pid=>{
      const partner = STUDENTS.find(s=>s.id===pid);
      if(partner) partner.cases = (partner.cases||[]).filter(c=>c.id!==cid);
    });

    // mirror the same case (same id, so progress is shared) into every participant's own list
    const allIds = [sid, ...newPartnerIds];
    allIds.forEach(pid=>{
      const person = STUDENTS.find(s=>s.id===pid);
      if(!person) return;
      if(!person.cases) person.cases = [];
      let personCase = person.cases.find(c=>c.id===cid);
      if(!personCase){
        personCase = { id: cid, caseType: cs.caseType, createdAt: cs.createdAt, partnerIds: [] };
        person.cases.push(personCase);
      }
      personCase.partnerIds = allIds.filter(x=>x!==pid);
    });

    state.linkingPartnersFor = null;
    await setData('students', STUDENTS);
    render(); return;
  }
  if(act==='toggle-step'){
    const cid = el.dataset.cid, stepid = el.dataset.stepid;
    if(!PROGRESS[cid]) PROGRESS[cid] = {};
    const cur = PROGRESS[cid][stepid];
    if(cur && cur.done){
      if(!confirm(cur.supervisor||'')) return;
      delete PROGRESS[cid][stepid];
    } else {
      PROGRESS[cid][stepid] = { done:true, supervisor: state.currentSupervisor, date: new Date().toISOString(), grade:'', notes:'' };
    }
    await setData('progress', PROGRESS);
    render(); return;
  }
  if(act==='save-eval'){
    const sid = el.dataset.sid, cid = el.dataset.cid, stepid = el.dataset.stepid;
    const grade = document.getElementById(`grade-${sid}-${cid}-${stepid}`).value;
    const notes = document.getElementById(`notes-${sid}-${cid}-${stepid}`).value;
    if(PROGRESS[cid] && PROGRESS[cid][stepid]){
      PROGRESS[cid][stepid].grade = grade;
      PROGRESS[cid][stepid].notes = notes;
      await setData('progress', PROGRESS);
    }
    render(); return;
  }
  if(act==='add-student-quick'){
    if(!state.currentDept || !state.supervisorCourseId) return;
    const name = prompt(t('promptStudentName')); if(!name) return;
    STUDENTS.push({id:uid(), studentCode:'', name:name.trim(), departmentId: state.currentDept, courseId: state.supervisorCourseId, group:'', subgroup:'', cases:[], createdAt:new Date().toISOString()});
    await setData('students', STUDENTS);
    render(); return;
  }

  if(act==='admin-tab'){ state.adminTab = el.dataset.tab; render(); return; }

  if(act==='add-department'){
    const name = document.getElementById('new-dept-name').value.trim();
    if(!name) return;
    if(!CONFIG.departments) CONFIG.departments = [];
    CONFIG.departments.push({ id: deptId(), name, courses: [] });
    await setData('config', CONFIG);
    render(); return;
  }
  if(act==='rename-department'){
    const d = getDept(el.dataset.id); if(!d) return;
    const newName = prompt(t('promptNewDepartmentName'), d.name);
    if(!newName || !newName.trim()) return;
    d.name = newName.trim();
    await setData('config', CONFIG);
    render(); return;
  }
  if(act==='del-department'){
    if(!confirm(t('confirmDeleteDepartment'))) return;
    CONFIG.departments = CONFIG.departments.filter(d=>d.id!==el.dataset.id);
    await setData('config', CONFIG);
    render(); return;
  }
  if(act==='add-course'){
    const d = getDept(el.dataset.did); if(!d) return;
    const inp = document.getElementById('new-course-'+d.id);
    const name = inp.value.trim();
    if(!name) return;
    if(!d.courses) d.courses = [];
    d.courses.push({ id: courseId(), name, steps: defaultSteps() });
    await setData('config', CONFIG);
    render(); return;
  }
  if(act==='rename-course'){
    const d = getDept(el.dataset.did); if(!d) return;
    const c = (d.courses||[]).find(x=>x.id===el.dataset.cid); if(!c) return;
    const newName = prompt(t('promptNewCourseName'), c.name);
    if(!newName || !newName.trim()) return;
    c.name = newName.trim();
    await setData('config', CONFIG);
    render(); return;
  }
  if(act==='del-course'){
    const d = getDept(el.dataset.did); if(!d) return;
    if(!confirm(t('confirmDeleteCourse'))) return;
    d.courses = (d.courses||[]).filter(c=>c.id!==el.dataset.cid);
    await setData('config', CONFIG);
    render(); return;
  }

  if(act==='add-student'){
    const name = document.getElementById('new-st-name').value.trim();
    const studentCode = document.getElementById('new-st-code').value.trim();
    const group = document.getElementById('new-st-group').value.trim();
    const subgroup = document.getElementById('new-st-subgroup').value.trim();
    const level = document.getElementById('new-st-level').value.trim();
    if(!name){ alert(t('alertEnterName')); return; }
    STUDENTS.push({id:uid(), studentCode, name, departmentId: state.adminDeptId, courseId: state.adminCourseId, group, subgroup, level, cases: [], createdAt:new Date().toISOString()});
    await setData('students', STUDENTS);
    render(); return;
  }
  if(act==='download-template'){
    const csv = '\uFEFF' + 'الاسم,الكود,المجموعة,المجموعة_الفرعية,المستوى,نوع_الحالة\nأحمد محمد,1023,A,A1,سنة أولى,تاج كامل\n';
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'قالب_الطلاب.csv'; a.click();
    URL.revokeObjectURL(url); return;
  }
  if(act==='import-students'){
    if(!state.adminDeptId || !state.adminCourseId){ alert(t('pickContextHint')); return; }
    const fileInput = document.getElementById('import-file');
    const file = fileInput && fileInput.files[0];
    if(!file){ alert(t('alertPickFile')); return; }
    try{
      await loadXLSX();
      const rows = await parseSpreadsheet(file);
      let added = 0, skipped = 0;
      const newGroups = new Set(), newSubgroups = new Set(), newCaseTypes = new Set(), newLevels = new Set();
      rows.forEach(row=>{
        const name = pickField(row, ['الاسم','اسم الطالب','name','الطالب']);
        if(!name){ skipped++; return; }
        const group = pickField(row, ['المجموعة','مجموعة','group']) || '';
        const subgroup = pickField(row, ['المجموعة_الفرعية','المجموعة الفرعية','subgroup','sub_group']) || '';
        const level = pickField(row, ['المستوى','مستوى','level']) || '';
        const caseType = pickField(row, ['نوع_الحالة','نوع الحالة','casetype','case']) || '';
        if(group && !CONFIG.groups.includes(group)) newGroups.add(group);
        if(subgroup && !CONFIG.subgroups.includes(subgroup)) newSubgroups.add(subgroup);
        if(level && !CONFIG.levels.includes(level)) newLevels.add(level);
        if(caseType && !CONFIG.caseTypes.includes(caseType)) newCaseTypes.add(caseType);
        const cases = caseType ? [{ id: caseId(), caseType, createdAt: new Date().toISOString(), partnerIds: [] }] : [];
        STUDENTS.push({
          id: uid(), studentCode: pickField(row, ['الكود','كود الطالب','id','code']) || '',
          name, departmentId: state.adminDeptId, courseId: state.adminCourseId, group, subgroup, level, cases,
          createdAt: new Date().toISOString()
        });
        added++;
      });
      CONFIG.groups.push(...newGroups); CONFIG.subgroups.push(...newSubgroups); CONFIG.caseTypes.push(...newCaseTypes); CONFIG.levels.push(...newLevels);
      await setData('students', STUDENTS);
      if(newGroups.size || newSubgroups.size || newCaseTypes.size || newLevels.size) await setData('config', CONFIG);
      state.importMsg = state.lang==='ar'
        ? `تم استيراد ${added} طالب بنجاح${skipped ? ' (تم تجاهل '+skipped+' صف بدون اسم)' : ''}.`
        : `Successfully imported ${added} student(s)${skipped ? ' ('+skipped+' row(s) skipped)' : ''}.`;
      fileInput.value = '';
    }catch(err){ state.importMsg = t('alertImportError'); console.error(err); }
    render(); return;
  }
  if(act==='del-student'){
    if(!confirm(t('confirmDeleteStudent'))) return;
    const id = el.dataset.id;
    const st = STUDENTS.find(s=>s.id===id);
    if(st){
      const progressSnapshot = {};
      (st.cases||[]).forEach(cs=>{ progressSnapshot[cs.id] = JSON.parse(JSON.stringify(PROGRESS[cs.id]||{})); });
      if(!ARCHIVE.students) ARCHIVE.students = [];
      ARCHIVE.students.push({
        archId: uid(),
        data: JSON.parse(JSON.stringify(st)),
        progressSnapshot,
        deletedAt: new Date().toISOString(),
        deletedBy: actorLabel()
      });
      (st.cases||[]).forEach(cs=>{
        const partners = cs.partnerIds||[];
        if(partners.length===0){
          delete PROGRESS[cs.id];
        } else {
          partners.forEach(pid=>{
            const p = STUDENTS.find(s=>s.id===pid);
            const pc = p && (p.cases||[]).find(c=>c.id===cs.id);
            if(pc) pc.partnerIds = (pc.partnerIds||[]).filter(x=>x!==id);
          });
        }
      });
    }
    STUDENTS = STUDENTS.filter(s=>s.id!==id);
    await setData('students', STUDENTS);
    await setData('progress', PROGRESS);
    await setData('archive', ARCHIVE);
    render(); return;
  }
  if(act==='del-case'){
    e.stopPropagation();
    const sid = el.dataset.sid, cid = el.dataset.cid;
    const st = STUDENTS.find(s=>s.id===sid); if(!st) return;
    const cs = (st.cases||[]).find(c=>c.id===cid); if(!cs) return;
    if(!confirm(t('confirmDeleteCase'))) return;
    const participantIds = [sid, ...(cs.partnerIds||[])];
    if(!ARCHIVE.cases) ARCHIVE.cases = [];
    ARCHIVE.cases.push({
      archId: uid(),
      studentId: sid, studentName: st.name,
      departmentId: st.departmentId, courseId: st.courseId,
      data: JSON.parse(JSON.stringify(cs)),
      progressSnapshot: JSON.parse(JSON.stringify(PROGRESS[cid]||{})),
      partnerNamesAtDeletion: partnerNames(st, cs),
      deletedAt: new Date().toISOString(),
      deletedBy: actorLabel()
    });
    participantIds.forEach(pid=>{
      const person = STUDENTS.find(s=>s.id===pid);
      if(person) person.cases = (person.cases||[]).filter(c=>c.id!==cid);
    });
    delete PROGRESS[cid];
    if(state.openCase===cid) state.openCase = null;
    await setData('students', STUDENTS);
    await setData('progress', PROGRESS);
    await setData('archive', ARCHIVE);
    render(); return;
  }
  if(act==='restore-student'){
    const archId = el.dataset.id;
    const idx = (ARCHIVE.students||[]).findIndex(a=>a.archId===archId);
    if(idx===-1) return;
    const entry = ARCHIVE.students[idx];
    const restored = JSON.parse(JSON.stringify(entry.data));
    STUDENTS.push(restored);
    (restored.cases||[]).forEach(cs=>{
      if(!PROGRESS[cs.id] && entry.progressSnapshot && entry.progressSnapshot[cs.id]){
        PROGRESS[cs.id] = JSON.parse(JSON.stringify(entry.progressSnapshot[cs.id]));
      }
      (cs.partnerIds||[]).forEach(pid=>{
        const partner = STUDENTS.find(s=>s.id===pid);
        if(!partner) return;
        const pc = (partner.cases||[]).find(c=>c.id===cs.id);
        if(pc && !(pc.partnerIds||[]).includes(restored.id)) pc.partnerIds = [...(pc.partnerIds||[]), restored.id];
      });
    });
    ARCHIVE.students.splice(idx,1);
    await setData('students', STUDENTS);
    await setData('progress', PROGRESS);
    await setData('archive', ARCHIVE);
    render(); return;
  }
  if(act==='restore-case'){
    const archId = el.dataset.id;
    const idx = (ARCHIVE.cases||[]).findIndex(a=>a.archId===archId);
    if(idx===-1) return;
    const entry = ARCHIVE.cases[idx];
    const owner = STUDENTS.find(s=>s.id===entry.studentId);
    if(!owner){ alert(t('restoreCaseOwnerMissing')); return; }
    const restoredCase = JSON.parse(JSON.stringify(entry.data));
    const participantIds = [entry.studentId, ...(restoredCase.partnerIds||[])];
    const stillExisting = participantIds.filter(pid=>STUDENTS.some(s=>s.id===pid));
    stillExisting.forEach(pid=>{
      const person = STUDENTS.find(s=>s.id===pid);
      if(!person) return;
      if(!person.cases) person.cases = [];
      if(!person.cases.some(c=>c.id===restoredCase.id)){
        person.cases.push(Object.assign(JSON.parse(JSON.stringify(restoredCase)), { partnerIds: stillExisting.filter(x=>x!==pid) }));
      }
    });
    if(!PROGRESS[restoredCase.id]) PROGRESS[restoredCase.id] = JSON.parse(JSON.stringify(entry.progressSnapshot||{}));
    ARCHIVE.cases.splice(idx,1);
    await setData('students', STUDENTS);
    await setData('progress', PROGRESS);
    await setData('archive', ARCHIVE);
    render(); return;
  }

  if(act==='add-supervisor'){
    const name = document.getElementById('new-sup-name').value.trim();
    const pass = document.getElementById('new-sup-pass').value.trim();
    if(!name || !pass){ alert(t('alertNameAndPass')); return; }
    if(!CREDENTIALS) CREDENTIALS = {supervisors:[], adminPassword: state.adminPass};
    if(CREDENTIALS.supervisors.some(s=>s.name===name)){ alert(t('alertDuplicateSupervisor')); return; }
    CREDENTIALS.supervisors.push({id:uid(), name, password:pass, departmentId: state.adminDeptId});
    const ok = await setData('credentials', CREDENTIALS);
    if(ok) SUP_NAMES = CREDENTIALS.supervisors.map(s=>s.name);
    render(); return;
  }
  if(act==='edit-supervisor'){
    const sup = CREDENTIALS.supervisors.find(s=>s.id===el.dataset.id); if(!sup) return;
    const newName = prompt(t('editSupervisorPromptName'), sup.name);
    if(newName===null) return;
    const newPass = prompt(t('editSupervisorPromptPass'), sup.password);
    if(newPass===null) return;
    if(!newName.trim() || !newPass.trim()) return;
    if(CREDENTIALS.supervisors.some(s=>s.id!==sup.id && s.name===newName.trim())){ alert(t('alertDuplicateSupervisor')); return; }
    sup.name = newName.trim(); sup.password = newPass.trim();
    const ok = await setData('credentials', CREDENTIALS);
    if(ok) SUP_NAMES = CREDENTIALS.supervisors.map(s=>s.name);
    render(); return;
  }
  if(act==='del-supervisor'){
    if(!confirm(t('confirmDeleteSupervisor'))) return;
    CREDENTIALS.supervisors = CREDENTIALS.supervisors.filter(s=>s.id!==el.dataset.id);
    const ok = await setData('credentials', CREDENTIALS);
    if(ok) SUP_NAMES = CREDENTIALS.supervisors.map(s=>s.name);
    render(); return;
  }

  if(act==='save-deadline'){
    const course = getCourse(state.adminDeptId, state.adminCourseId); if(!course) return;
    course.deadline = document.getElementById('course-deadline').value.trim();
    const ok = await setData('config', CONFIG);
    if(ok) alert(t('brandSaved'));
    render(); return;
  }
  if(act==='save-course-casetypes'){
    const course = getCourse(state.adminDeptId, state.adminCourseId); if(!course) return;
    const checked = [...document.querySelectorAll('.course-casetype-chk:checked')].map(el=>el.value);
    course.caseTypes = checked;
    if(!course.caseTypeConfigs) course.caseTypeConfigs = [];
    checked.forEach(name=>{
      if(!course.caseTypeConfigs.some(c=>c.name===name)) course.caseTypeConfigs.push({name, steps:[]});
    });
    const ok = await setData('config', CONFIG);
    if(ok) alert(t('brandSaved'));
    render(); return;
  }
  if(act==='add-step'){
    const course = getCourse(state.adminDeptId, state.adminCourseId); if(!course) return;
    const cfg = caseTypeConfig(course, state.stepsCaseType); if(!cfg) return;
    const val = document.getElementById('new-step-name').value.trim();
    if(!val) return;
    if(cfg.steps.some(s=>s.name===val)){ alert(t('alertDuplicateStep')); return; }
    cfg.steps.push({id: stepId(), name: val});
    await setData('config', CONFIG);
    render(); return;
  }
  if(act==='del-step'){
    const course = getCourse(state.adminDeptId, state.adminCourseId); if(!course) return;
    const cfg = caseTypeConfig(course, state.stepsCaseType); if(!cfg) return;
    if(!confirm(t('confirmDeleteStep'))) return;
    cfg.steps.splice(+el.dataset.idx,1);
    await setData('config', CONFIG);
    render(); return;
  }
  if(act==='rename-step'){
    const course = getCourse(state.adminDeptId, state.adminCourseId); if(!course) return;
    const cfg = caseTypeConfig(course, state.stepsCaseType); if(!cfg) return;
    const idx = +el.dataset.idx;
    const step = cfg.steps[idx];
    const newName = prompt(t('promptNewStepName'), step.name);
    if(!newName || !newName.trim()) return;
    if(cfg.steps.some((s,i)=>i!==idx && s.name===newName.trim())){ alert(t('alertDuplicateStep')); return; }
    step.name = newName.trim();
    await setData('config', CONFIG);
    render(); return;
  }
  if(act==='move-step'){
    const course = getCourse(state.adminDeptId, state.adminCourseId); if(!course) return;
    const cfg = caseTypeConfig(course, state.stepsCaseType); if(!cfg) return;
    const idx = +el.dataset.idx, dir = el.dataset.dir;
    const swap = dir==='up' ? idx-1 : idx+1;
    if(swap<0 || swap>=cfg.steps.length) return;
    [cfg.steps[idx], cfg.steps[swap]] = [cfg.steps[swap], cfg.steps[idx]];
    await setData('config', CONFIG);
    render(); return;
  }

  if(act==='add-list-value'){
    const listKey = el.dataset.list;
    const inp = document.getElementById('new-list-'+listKey);
    const val = inp.value.trim();
    if(!val) return;
    if(CONFIG[listKey].includes(val)){ alert(t('alertDuplicateListValue')); return; }
    CONFIG[listKey].push(val);
    await setData('config', CONFIG);
    render(); return;
  }
  if(act==='del-list-value'){
    const listKey = el.dataset.list, idx = +el.dataset.idx;
    if(!confirm(t('confirmDeleteListValue'))) return;
    CONFIG[listKey].splice(idx,1);
    await setData('config', CONFIG);
    render(); return;
  }
  if(act==='save-field-label'){
    const labelKey = el.dataset.label;
    const val = document.getElementById('label-'+labelKey).value.trim();
    if(!CONFIG.fieldLabels) CONFIG.fieldLabels = {};
    CONFIG.fieldLabels[labelKey] = val;
    const ok = await setData('config', CONFIG);
    if(ok) alert(t('brandSaved'));
    render(); return;
  }

  if(act==='save-theme'){
    const mode = document.getElementById('theme-mode').value;
    const accent = document.getElementById('theme-accent').value;
    CONFIG.theme = { mode, accent };
    const ok = await setData('config', CONFIG);
    if(ok) alert(t('brandSaved'));
    render(); return;
  }
  if(act==='save-branding'){
    CONFIG.brandTitle = document.getElementById('brand-title').value.trim();
    CONFIG.brandSubtitle = document.getElementById('brand-subtitle').value.trim();
    CONFIG.logoUrl = document.getElementById('brand-logo').value.trim();
    const ok = await setData('config', CONFIG);
    if(ok) alert(t('brandSaved'));
    render(); return;
  }
  if(act==='change-admin-pass'){
    const val = document.getElementById('new-admin-pass').value.trim();
    if(!val){ alert(t('alertEnterNewPassword')); return; }
    if(!CREDENTIALS) CREDENTIALS = {supervisors:[], adminPassword: state.adminPass};
    CREDENTIALS.adminPassword = val;
    const ok = await setData('credentials', CREDENTIALS);
    if(ok){ state.adminPass = val; alert(t('alertPasswordChanged')); }
    render(); return;
  }

  if(act==='export-csv'){
    const course = getCourse(state.adminDeptId, state.adminCourseId);
    const students = statsFilteredStudents();
    let exportRows = [];
    students.forEach(st=> (st.cases||[]).forEach(cs=> exportRows.push({st,cs})) );
    if(state.statsCaseTypeFilter) exportRows = exportRows.filter(({cs})=>cs.caseType===state.statsCaseTypeFilter);
    // union of step names across whichever case types actually appear in the export
    const seenNames = new Set(), stepNameColumns = [];
    exportRows.forEach(({cs})=>{ caseSteps(course, cs.caseType).forEach(s=>{ if(!seenNames.has(s.name)){ seenNames.add(s.name); stepNameColumns.push(s.name); } }); });
    let csv = '\uFEFF' + [t('tableStudent'), t('studentCodeLabel'), fieldLabel('group'), fieldLabel('subgroup'), fieldLabel('level'), t('tableCase'), t('partnersLabel').replace(': ',''), t('tablePct'), t('tableGrade')].map(h=>`"${h}"`).join(',') + ',';
    csv += stepNameColumns.map(n=>`"${n.replace(/"/g,'""')}"`).join(',') + '\n';
    exportRows.forEach(({st,cs})=>{
      const p = PROGRESS[cs.id]||{};
      const pct = casePct(st,cs);
      const rowSteps = caseSteps(course, cs.caseType);
      const cells = stepNameColumns.map(colName=>{
        const step = rowSteps.find(s=>s.name===colName);
        if(!step) return 'N/A';
        const rec = p[step.id];
        return rec && rec.done ? `"${rec.supervisor} - ${fmtDate(rec.date)}${rec.grade!==undefined&&rec.grade!==''?' - '+rec.grade:''}${rec.notes?' - '+rec.notes:''}"` : '-';
      });
      csv += `"${st.name}","${st.studentCode||''}","${st.group||''}","${st.subgroup||''}","${st.level||''}","${cs.caseType||''}","${partnerNames(st,cs).join('; ')}","${pct}%","${caseTotalGrade(st,cs)}",` + cells.join(',') + '\n';
    });
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'prostho-stats.csv'; a.click();
    URL.revokeObjectURL(url); return;
  }
}

let xlsxLoadPromise = null;
function loadXLSX(){
  if(window.XLSX) return Promise.resolve();
  if(xlsxLoadPromise) return xlsxLoadPromise;
  xlsxLoadPromise = new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('failed to load xlsx library'));
    document.head.appendChild(s);
  });
  return xlsxLoadPromise;
}
function parseSpreadsheet(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      try{
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, {type:'array'});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        resolve(XLSX.utils.sheet_to_json(sheet, {defval:''}));
      }catch(err){ reject(err); }
    };
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}
function pickField(row, keys){
  const normalized = {};
  Object.keys(row).forEach(k => { normalized[k.trim().toLowerCase()] = row[k]; });
  for(const k of keys){
    const v = normalized[k.trim().toLowerCase()];
    if(v !== undefined && v !== null && (''+v).trim() !== '') return (''+v).trim();
  }
  return '';
}

/* ---------------- Init ---------------- */
async function init(){
  state.storageOk = scriptConfigured();
  const [cfg, supNames, students, progress, archive] = await Promise.all([
    getData('config', null),
    fetchSupervisorNames(),
    getData('students', []),
    getData('progress', {}),
    getData('archive', null)
  ]);
  CONFIG = mergeConfig(cfg);
  SUP_NAMES = supNames;
  STUDENTS = students;
  PROGRESS = progress;
  ARCHIVE = normalizeArchive(archive);
  state.loading = false;
  render();
}
init();
